<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImageVerify — Premium AI Image Forensics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <link rel="stylesheet" href="/src/styles/app-extensions.css" />
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Navigation Bar -->
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo" onclick="window.app.navigate('login')">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <span class="logo-text">Image<span class="logo-accent">Verify</span></span>
            </a>
            
            <nav class="nav-links" id="nav-unauthenticated">
                <a href="#" onclick="window.app.navigate('login')" class="nav-link">Login</a>
                <a href="#" onclick="window.app.navigate('register')" class="btn-primary-small">Sign Up</a>
            </nav>

            <nav class="nav-links" id="nav-authenticated" style="display: none;">
                <a href="#" onclick="window.app.navigate('dashboard')" class="nav-link">Dashboard</a>
                <div class="user-menu-dropdown">
                    <button class="user-avatar" id="nav-user-avatar">U</button>
                    <div class="dropdown-content">
                        <div class="dropdown-header">
                            <strong id="dropdown-name">User Name</strong>
                            <span id="dropdown-email">user@email.com</span>
                        </div>
                        <a href="#" onclick="window.app.navigate('profile')">Profile</a>
                        <hr>
                        <a href="#" onclick="window.app.logout()" class="text-red">Logout</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main id="app-root"></main>

    <!-- UI Templates -->
    <template id="tpl-home">
        <section class="hero slide-up">
            <div class="hero-content">
                <div class="hero-badge">
                    <span class="badge-dot"></span>
                    AI-Powered Analysis Engine v3.0
                </div>
                <h1 class="hero-title">
                    Detect <span class="gradient-text">AI-Generated</span> Images<br>
                    with Forensic Precision
                </h1>
                <p class="hero-subtitle">
                    Upload any image and our multi-layer analysis engine will examine metadata, 
                    GPS location, compression patterns, resolution signatures, and software fingerprints to determine authenticity.
                </p>
                <div class="hero-features">
                    <div class="hero-feature">✓ GPS Tracking</div>
                    <div class="hero-feature">✓ Deep Analysis</div>
                    <div class="hero-feature">✓ Full Reports</div>
                </div>
                <button onclick="window.app.navigate('register')" class="hero-cta">
                    Start Analysis
                </button>
            </div>
            <!-- Floating Analysis Cards -->
            <div class="floating-cards">
                <div class="float-card float-card-1">
                    <div class="float-card-icon" style="color: #f87171;">⚠</div>
                    <div class="float-card-text">Midjourney Detected</div>
                </div>
                <div class="float-card float-card-2">
                    <div class="float-card-icon" style="color: #4ade80;">📍</div>
                    <div class="float-card-text">GPS: 40.7°N, 74.0°W</div>
                </div>
            </div>
        </section>
    </template>

    <template id="tpl-login">
        <div class="auth-container slide-up">
            <div class="auth-card">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Log in to access your dashboard</p>
                
                <div id="login-error" class="alert alert-error" style="display: none;"></div>
                
                <form id="login-form" onsubmit="window.app.handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username or Email</label>
                        <input type="text" id="login-username" class="form-control" required placeholder="Enter your username or email">
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                            <button type="button" class="btn-toggle-password" onclick="window.app.togglePassword('login-password')">👁️</button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link" onclick="window.app.navigate('forgot-password')">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary w-full" id="btn-login-submit">
                        <span class="btn-text">Log In</span>
                        <span class="btn-loader" style="display:none;"></span>
                    </button>
                    
                    <div class="auth-divider">
                        <span>or</span>
                    </div>

                    <button type="button" class="btn-secondary w-full" onclick="window.app.navigate('register')">
                        Create Account
                    </button>
                </form>
                
                <p class="auth-footer">
                    Don't have an account? <a href="#" onclick="window.app.navigate('register')">Sign up</a>
                </p>
            </div>
        </div>
    </template>

    <template id="tpl-register">
        <div class="auth-container slide-up">
            <div class="auth-card">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join ImageVerify to start analyzing images</p>
                
                <div id="register-error" class="alert alert-error" style="display: none;"></div>
                
                <form id="register-form" onsubmit="window.app.handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-fullname">Full Name</label>
                        <input type="text" id="reg-fullname" class="form-control" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" class="form-control" required placeholder="johndoe123">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" required placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">Phone Number (Optional)</label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-password" class="form-control" required placeholder="••••••••" oninput="window.app.checkPasswordStrength(this.value)">
                            <button type="button" class="btn-toggle-password" onclick="window.app.togglePassword('reg-password')">👁️</button>
                        </div>
                        <div class="password-strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-text" id="strength-text">Minimum 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm-password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-confirm-password" class="form-control" required placeholder="••••••••">
                            <button type="button" class="btn-toggle-password" onclick="window.app.togglePassword('reg-confirm-password')">👁️</button>
                        </div>
                    </div>

                    <div class="form-options" style="margin-bottom: 20px;">
                        <label class="checkbox-container">
                            <input type="checkbox" id="reg-terms" required>
                            <span class="checkmark"></span>
                            I accept the <a href="#" class="forgot-link">Terms & Conditions</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary w-full" id="btn-register-submit">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display:none;"></span>
                    </button>
                </form>
                
                <p class="auth-footer">
                    Already have an account? <a href="#" onclick="window.app.navigate('login')">Log in</a>
                </p>
            </div>
        </div>
    </template>

    <template id="tpl-forgot-password">
        <div class="auth-container slide-up">
            <div class="auth-card">
                <h2>Reset Password</h2>
                <p class="auth-subtitle">Enter your email to receive a reset link</p>
                
                <div id="forgot-error" class="alert alert-error" style="display: none;"></div>
                <div id="forgot-success" class="alert alert-success" style="display: none; background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 20px;"></div>
                
                <form id="forgot-form" onsubmit="window.app.handleForgotPassword(event)">
                    <div class="form-group">
                        <label for="forgot-email">Email Address</label>
                        <input type="email" id="forgot-email" class="form-control" required placeholder="john@example.com">
                    </div>
                    
                    <button type="submit" class="btn-primary w-full" id="btn-forgot-submit">
                        Send Reset Link
                    </button>
                </form>
                
                <p class="auth-footer">
                    Remember your password? <a href="#" onclick="window.app.navigate('login')">Log in</a>
                </p>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard">
        <div class="dashboard-container slide-up">
            <header class="dashboard-header">
                <h2>Dashboard Overview</h2>
                <p>Welcome back, <span id="dash-user-name">User</span>!</p>
            </header>

            <!-- Dashboard Stats / Cards -->
            <div class="dash-cards">
                <div class="dash-card">
                    <div class="dash-card-icon text-accent-1">🔍</div>
                    <div class="dash-card-value" id="stat-total">0</div>
                    <div class="dash-card-label">Total Analyses</div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-icon text-red">⚠</div>
                    <div class="dash-card-value" id="stat-ai">0</div>
                    <div class="dash-card-label">AI Detected</div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-icon text-green">✓</div>
                    <div class="dash-card-value" id="stat-real">0</div>
                    <div class="dash-card-label">Human Built</div>
                </div>
            </div>

            <!-- Upload Section -->
            <section class="upload-section card mt-8" id="upload">
                <div class="section-header">
                    <h3 class="section-title">New <span class="gradient-text">Analysis</span></h3>
                    <p class="section-desc">Drop your image below to begin the forensic analysis pipeline</p>
                </div>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-content" id="uploadContent">
                        <div class="upload-icon-wrap">
                            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <div class="upload-ring"></div>
                        </div>
                        <p class="upload-text">Drag & drop your image here</p>
                        <p class="upload-subtext">or click to browse • PNG, JPG, WEBP supported</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>

                    <!-- Preview -->
                    <div class="preview-container" id="previewContainer" style="display:none;">
                        <img id="previewImage" class="preview-image" alt="Uploaded image preview">
                        <div class="preview-info">
                            <span class="preview-name" id="previewName"></span>
                            <span class="preview-size" id="previewSize"></span>
                        </div>
                        <button class="btn-remove" id="btnRemove" title="Remove image">✕</button>
                    </div>
                </div>

                <button class="analyze-btn" id="analyzeBtn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Run Full Analysis
                </button>
            </section>
            
            <!-- Analysis Pipeline (Hidden initially) -->
            <section class="pipeline-section card mt-8" id="pipelineSection" style="display:none;">
                         <div class="section-header">
            <h2 class="section-title">Analysis <span class="gradient-text">Pipeline</span></h2>
            <p class="section-desc">Running multi-layer forensic checks on your image</p>
        </div>

        <div class="pipeline">
            <div class="pipeline-step" id="step-metadata">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">Metadata Extraction</h3>
                    <p class="step-desc">Reading EXIF data, camera info, shooting parameters</p>
                </div>
                <div class="step-status" id="status-metadata">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-software">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">Software Detection</h3>
                    <p class="step-desc">Checking for AI tools, editors, and generators</p>
                </div>
                <div class="step-status" id="status-software">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-resolution">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">Resolution Analysis</h3>
                    <p class="step-desc">Comparing dimensions against known AI patterns</p>
                </div>
                <div class="step-status" id="status-resolution">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-compression">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">Compression Analysis</h3>
                    <p class="step-desc">Analyzing quantization tables and artifacts</p>
                </div>
                <div class="step-status" id="status-compression">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-location">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">Location Tracking</h3>
                    <p class="step-desc">Extracting GPS coordinates, altitude, and direction</p>
                </div>
                <div class="step-status" id="status-location">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-header">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">File Structure Validation</h3>
                    <p class="step-desc">Verifying file headers and binary integrity</p>
                </div>
                <div class="step-status" id="status-header">Pending</div>
            </div>

            <div class="pipeline-connector"></div>

            <div class="pipeline-step" id="step-api">
                <div class="step-indicator">
                    <div class="step-spinner"></div>
                    <div class="step-check">✓</div>
                </div>
                <div class="step-info">
                    <h3 class="step-title">AI Detection API</h3>
                    <p class="step-desc">Querying third-party Hive AI engine</p>
                </div>
                <div class="step-status" id="status-api">Pending</div>
            </div>
        </div>
            </section>
            
            <!-- Report Section (Hidden initially) -->
            <section class="report-section" id="reportSection" style="display:none;">
                        <div class="section-header">
            <h2 class="section-title">Authenticity <span class="gradient-text">Report</span></h2>
            <p class="section-desc">Comprehensive forensic analysis results</p>
        </div>

        <div class="report-card">
            <!-- Report Header -->
            <div class="report-header">
                <div class="report-header-left">
                    <img id="reportThumb" class="report-thumb" alt="Analyzed image thumbnail">
                    <div>
                        <h3 class="report-filename" id="reportFilename"></h3>
                        <p class="report-timestamp" id="reportTimestamp"></p>
                    </div>
                </div>
                <div class="report-badge" id="reportBadge">Analyzing...</div>
            </div>

            <!-- Score Gauge -->
            <div class="score-section">
                <div class="score-gauge">
                    <svg class="gauge-svg" viewBox="0 0 200 200">
                        <circle class="gauge-bg" cx="100" cy="100" r="85" />
                        <circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="85" />
                    </svg>
                    <div class="gauge-center">
                        <span class="gauge-score" id="gaugeScore">0</span>
                        <span class="gauge-label">/ 100</span>
                    </div>
                </div>
                <div class="score-legend">
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#4ade80;"></span>
                        <span>0 – 30: Likely Real</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#facc15;"></span>
                        <span>31 – 70: Suspicious</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#f87171;"></span>
                        <span>71 – 100: Likely AI</span>
                    </div>
                </div>
            </div>

            <!-- Verdict -->
            <div class="verdict-box" id="verdictBox">
                <div class="verdict-icon" id="verdictIcon"></div>
                <div>
                    <h3 class="verdict-title" id="verdictTitle">Analyzing...</h3>
                    <p class="verdict-desc" id="verdictDesc"></p>
                </div>
            </div>

            <!-- Overview Data -->
            <div class="overview-section" style="margin-bottom: 2rem;">
                <h3 class="findings-title">LOCAL ANALYSIS</h3>
                <div class="overview-grid" style="display: grid; grid-template-columns: auto 1fr; gap: 12px; background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; margin-bottom: 1rem;">
                    <div style="color: #a1a1aa;">EXIF Status</div>
                    <div id="overviewExif"></div>
                    <div style="color: #a1a1aa;">Camera</div>
                    <div id="overviewCamera"></div>
                    <div style="color: #a1a1aa;">Software</div>
                    <div id="overviewSoftware"></div>
                    <div style="color: #a1a1aa;">Resolution</div>
                    <div id="overviewResolution"></div>
                    <div style="color: #a1a1aa;">GPS Metadata</div>
                    <div id="overviewGps"></div>
                </div>

                <h3 class="findings-title">AI DETECTION SERVICES</h3>
                <div class="overview-grid" style="display: grid; grid-template-columns: auto 1fr; gap: 12px; background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; margin-bottom: 1rem;">
                    <div style="color: #a1a1aa;">Hive Score</div>
                    <div id="overviewHive"></div>
                    <div style="color: #a1a1aa;">Sightengine Score</div>
                    <div id="overviewSightengine"></div>
                    <div style="color: #a1a1aa;">Avg AI Probability</div>
                    <div id="overviewAiProb" style="font-weight: bold;"></div>
                </div>

                <h3 class="findings-title">RISK ASSESSMENT</h3>
                <div class="overview-grid" style="display: grid; grid-template-columns: auto 1fr; gap: 12px; background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;">
                    <div style="color: #a1a1aa;">Risk Level</div>
                    <div id="overviewRisk"></div>
                    <div style="color: #a1a1aa;">Evidence</div>
                    <div id="overviewEvidence" style="white-space: pre-line;"></div>
                </div>
            </div>

            <!-- Location Map -->
            <div class="location-section" id="locationSection" style="display:none;">
                <h3 class="findings-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="vertical-align: -3px; margin-right: 6px;">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        Photo Location
                    </span>
                    <button id="btnRevealMap" style="background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Reveal Map</button>
                </h3>
                <div class="map-container" id="mapWrapper" style="display: none;">
                    <div id="locationMap" class="location-map"></div>
                </div>
                <div class="location-details" id="locDetailsWrapper" style="display: none;">
                    <div class="loc-detail-grid">
                        <div class="loc-detail-item">
                            <span class="loc-detail-label">Latitude</span>
                            <span class="loc-detail-value" id="locLatitude">—</span>
                        </div>
                        <div class="loc-detail-item">
                            <span class="loc-detail-label">Longitude</span>
                            <span class="loc-detail-value" id="locLongitude">—</span>
                        </div>
                        <div class="loc-detail-item">
                            <span class="loc-detail-label">Altitude</span>
                            <span class="loc-detail-value" id="locAltitude">—</span>
                        </div>
                        <div class="loc-detail-item">
                            <span class="loc-detail-label">Address</span>
                            <span class="loc-detail-value loc-address" id="locAddress">Looking up...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- No Location Placeholder -->
            <div class="no-location-section" id="noLocationSection" style="display:none;">
                <h3 class="findings-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="vertical-align: -3px; margin-right: 6px;">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    Photo Location
                </h3>
                <div class="no-location-box">
                    <div class="no-loc-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" opacity="0.3"/>
                            <circle cx="12" cy="10" r="3" opacity="0.3"/>
                            <line x1="2" y1="2" x2="22" y2="22" stroke-width="2"/>
                        </svg>
                    </div>
                    <p class="no-loc-title">No Location Data Found</p>
                    <p class="no-loc-desc">This image does not contain GPS coordinates. AI-generated images never include genuine location data.</p>

            <!-- Detailed Findings -->
            <div class="findings">

                <div class="finding-card" id="finding-metadata">

                    </div>
                    <p class="finding-detail" id="detail-metadata"></p>
                </div>

                <div class="finding-card" id="finding-software">
                    <div class="finding-header">
                        <span class="finding-icon" id="icon-software"></span>

                </div>

                <div class="finding-card" id="finding-resolution">

                        <span class="finding-icon" id="icon-resolution"></span>

                    </div>

                <div class="finding-card" id="finding-compression">

                    </div>
                    <p class="finding-detail" id="detail-compression"></p>
                </div>

                <div class="finding-card" id="finding-location">
                    <div class="finding-header">
                        <span class="finding-icon" id="icon-location"></span>
                        <h4 class="finding-name">Location Tracking</h4>
                        <span class="finding-points" id="points-location"></span>
                    </div>
                    <p class="finding-detail" id="detail-location"></p>
                </div>

                <div class="finding-card" id="finding-header">
                    <div class="finding-header">
                        <span class="finding-icon" id="icon-header"></span>
                        <h4 class="finding-name">File Structure</h4>
                        <span class="finding-points" id="points-header"></span>
                    </div>
                    <p class="finding-detail" id="detail-header"></p>
                </div>
            </div>

            <!-- Score Breakdown -->
            <div class="breakdown">
                <h3 class="findings-title">Score Breakdown</h3>
                <div class="breakdown-bars" id="breakdownBars"></div>
            </div>

            <!-- Actions -->
            <div class="report-actions">
                <button class="action-btn action-download" id="btnDownloadReport">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download PDF
                </button>
                <button class="action-btn action-new" id="btnNewAnalysis">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                    New Analysis
                </button>
            </div>
        </div>
            </section>

        </div>
